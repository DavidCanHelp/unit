# compose.drill.yml — multihost wedge-drill topology for unit.
#
# Four services on one bridge network, stable names so peer config is
# deterministic (unit resolves hostnames via to_socket_addrs):
#
#   root  — the recruiter under test (top of the tree)
#   mid   — the wedge target (docker pause = cgroup freezer, the
#           whole-container SIGSTOP; also the over-ceiling node for the
#           deferred/unplaced scenarios via ALLOC-MB)
#   leaf1 — worker; stopped/started by the drill to add/remove capacity
#   leaf2 — spare worker for the recovery paths
#
# Each node's stdout is teed to ./drill-logs/<name>.log (bind mount) so
# drill.sh can grep the exact lines the code emits. NET_ADMIN is granted
# for the optional tc-netem realism layer (DRILL_NETEM=1).
#
# UNIT_RECRUIT_TIMEOUT_SECS compresses the 60s recruit window for the
# drill; the peer-eviction window (15s) is fixed in the mesh.

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: unit-drill:latest
  cap_add: [NET_ADMIN]
  volumes:
    - ./drill-logs:/logs
  environment: &node-env
    UNIT_PORT: "4200"
    UNIT_RECRUIT_TIMEOUT_SECS: ${UNIT_RECRUIT_TIMEOUT_SECS:-2}
    DRILL_NETEM: ${DRILL_NETEM:-0}
  init: true

services:
  root:
    <<: *node
    hostname: root
    environment:
      <<: *node-env
      DRILL_NAME: root
  mid:
    <<: *node
    hostname: mid
    environment:
      <<: *node-env
      DRILL_NAME: mid
      UNIT_PEERS: root:4200
  leaf1:
    <<: *node
    hostname: leaf1
    profiles: [leaves]
    environment:
      <<: *node-env
      DRILL_NAME: leaf1
      UNIT_PEERS: root:4200,mid:4200
  leaf2:
    <<: *node
    hostname: leaf2
    profiles: [leaves]
    environment:
      <<: *node-env
      DRILL_NAME: leaf2
      UNIT_PEERS: root:4200,mid:4200
  # --- S5: cgroup honesty (container awareness) ----------------------------
  # Three cgroup-limited services. memswap_limit == mem_limit pins the swap
  # budget to zero so the combined-budget model pivots on RAM alone: with
  # ballast, ctight honestly advertises insufficient headroom while croomy
  # stays abundant — and placement must prefer the truthful roomier peer.
  cboss:
    <<: *node
    hostname: cboss
    profiles: [cgroup]
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      <<: *node-env
      DRILL_NAME: cboss
  ctight:
    <<: *node
    hostname: ctight
    profiles: [cgroup]
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      <<: *node-env
      DRILL_NAME: ctight
      UNIT_PEERS: cboss:4200
  croomy:
    <<: *node
    hostname: croomy
    profiles: [cgroup]
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      <<: *node-env
      DRILL_NAME: croomy
      # cboss for S5; ctight for S4 (cboss may be down then — the
      # unresolvable seed is skipped with a logged error).
      UNIT_PEERS: cboss:4200,ctight:4200

  # --- S6: transport under the ceiling (confirm-before-release) ------------
  # A 200 MiB sender boots 900 in-process units (~86% of its cgroup budget:
  # honestly OVER-CEILING, deterministically) and sheds toward a roomy
  # receiver. Mirrors the v0.30 droplet validation, in CI.
  tnode:
    <<: *node
    hostname: tnode
    profiles: [transport]
    mem_limit: 160m
    memswap_limit: 160m
    environment:
      <<: *node-env
      DRILL_NAME: tnode
      DRILL_ARGS: --multi-unit 900 --port 4200 --peers rnode:4200 --gossip-k 8
      UNIT_PEERS: rnode:4200
  rnode:
    <<: *node
    hostname: rnode
    profiles: [transport]
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      <<: *node-env
      DRILL_NAME: rnode
      DRILL_ARGS: --multi-unit 20 --port 4200 --gossip-k 8

  # --- S8: ecology — heterogeneous colony under pressure ------------------
  # Three over-ceiling senders (450 units in a 96 MiB budget ≈ 94%) and two
  # small receivers (20 units in 128 MiB ≈ 18%). Tests the README claim
  # "the colony rebalances toward boxes with room" under SIMULTANEOUS
  # multi-sender pressure — convergence, wall integrity on receivers,
  # conservation — plus a mid-shed receiver blackhole (partition, no RST).
  e1:
    <<: *node
    hostname: e1
    profiles: [ecology]
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      <<: *node-env
      DRILL_NAME: e1
      DRILL_ARGS: --multi-unit 520 --port 4200 --peers e4:4200,e5:4200 --gossip-k 8
  e2:
    <<: *node
    hostname: e2
    profiles: [ecology]
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      <<: *node-env
      DRILL_NAME: e2
      DRILL_ARGS: --multi-unit 520 --port 4200 --peers e4:4200,e5:4200 --gossip-k 8
  e3:
    <<: *node
    hostname: e3
    profiles: [ecology]
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      <<: *node-env
      DRILL_NAME: e3
      DRILL_ARGS: --multi-unit 520 --port 4200 --peers e4:4200,e5:4200 --gossip-k 8
  e4:
    <<: *node
    hostname: e4
    profiles: [ecology]
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *node-env
      DRILL_NAME: e4
      DRILL_ARGS: --multi-unit 20 --port 4200 --peers e1:4200 --gossip-k 8
  e5:
    <<: *node
    hostname: e5
    profiles: [ecology]
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *node-env
      DRILL_NAME: e5
      DRILL_ARGS: --multi-unit 20 --port 4200 --peers e1:4200 --gossip-k 8

  # --- Soak: long-lived evolution colony (docker/soak.sh) -----------------
  # Three balanced nodes with mild pressure (~50% at boot): room for GP
  # state to grow, occasional pressure-driven migration, and hours of
  # uninterrupted evolution. The chronicle lines are the record; soak.sh
  # report turns them into an adaptation-vs-churn verdict.
  s1:
    <<: *node
    hostname: s1
    profiles: [soak]
    mem_limit: ${SOAK_MEM:-128m}
    memswap_limit: ${SOAK_MEM:-128m}
    environment:
      <<: *node-env
      DRILL_NAME: s1
      DRILL_ARGS: --multi-unit 300 --port 4200 --peers s2:4200,s3:4200 --gossip-k 8
  s2:
    <<: *node
    hostname: s2
    profiles: [soak]
    mem_limit: ${SOAK_MEM:-128m}
    memswap_limit: ${SOAK_MEM:-128m}
    environment:
      <<: *node-env
      DRILL_NAME: s2
      DRILL_ARGS: --multi-unit 300 --port 4200 --peers s1:4200,s3:4200 --gossip-k 8
  s3:
    <<: *node
    hostname: s3
    profiles: [soak]
    mem_limit: ${SOAK_MEM:-128m}
    memswap_limit: ${SOAK_MEM:-128m}
    environment:
      <<: *node-env
      DRILL_NAME: s3
      DRILL_ARGS: --multi-unit 300 --port 4200 --peers s1:4200,s2:4200 --gossip-k 8
